databaseChangeLog:
  - changeSet:
      id: 005-create-packages_benefits
      author: alan
      changes:
        - createTable:
            tableName: packages_benefits
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true

              - column:
                  name: package_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              - column:
                  name: benefit_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false