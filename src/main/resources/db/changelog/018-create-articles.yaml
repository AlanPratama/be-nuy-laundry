databaseChangeLog:
  - changeSet:
      id: 018-create-articles
      author: alan
      changes:
        - createTable:
            tableName: articles
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true

              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: slug
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: category
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: excerpt
                  type: VARCHAR(500)

              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: reading_time
                  type: VARCHAR(50)

              - column:
                  name: thumbnail_url
                  type: VARCHAR(500)

              - column:
                  name: is_published
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: author_id
                  type: VARCHAR(36)

              - column:
                  name: published_at
                  type: TIMESTAMP

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
