databaseChangeLog:
  - changeSet:
      id: 006-create-transactions
      author: alan
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true

              - column:
                  name: customer_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: true

              - column:
                  name: user_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: true

              - column:
                  name: invoice_no
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: total_price
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: order_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: target_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: IN_PROGRESS
                  constraints:
                    nullable: false

              - column:
                  name: customer_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: customer_phone
                  type: VARCHAR(50)

              - column:
                  name: customer_address
                  type: TEXT

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false