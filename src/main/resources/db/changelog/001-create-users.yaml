databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: alan
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: phone
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: address
                  type: TEXT

              - column:
                  name: role
                  type: VARCHAR(50)
                  defaultValue: "STAFF"
                  constraints:
                    nullable: false

              - column:
                  name: profile_picture
                  type: VARCHAR(255)

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false