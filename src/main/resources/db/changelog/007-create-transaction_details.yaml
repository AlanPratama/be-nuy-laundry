databaseChangeLog:
  - changeSet:
      id: 007-create-transaction_details
      author: alan
      changes:
        - createTable:
            tableName: transaction_details
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true

              - column:
                  name: package_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: true

              - column:
                  name: transaction_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: INT4
                  constraints:
                    nullable: false

              - column:
                  name: total_price
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: package_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: package_description
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: package_days_estimation
                  type: INT4
                  constraints:
                    nullable: false

              - column:
                  name: package_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: target_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: delivered_date
                  type: TIMESTAMP

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false