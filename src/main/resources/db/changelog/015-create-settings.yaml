databaseChangeLog:
  - changeSet:
      id: 015-create-settings
      author: alan
      changes:
        - createTable:
            tableName: settings
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true

              - column:
                  name: outlet_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: address
                  type: TEXT

              - column:
                  name: phone
                  type: VARCHAR(50)

              - column:
                  name: open_hour
                  type: VARCHAR(10)

              - column:
                  name: close_hour
                  type: VARCHAR(10)

              - column:
                  name: free_radius_km
                  type: INT

              - column:
                  name: extra_cost_per_km
                  type: INT

              - column:
                  name: receipt_footer_note
                  type: TEXT

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
