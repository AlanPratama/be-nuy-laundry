# ========================================================
# PERFORMANCE PROFILING CONFIGURATION (BE Nuy Laundry)
# ========================================================

# Disable SQL formatting and console spam during load tests to prevent I/O bottleneck
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.highlight_sql=false

# Reduce Liquibase verbosity during test runs
logging.level.liquibase=INFO
logging.level.org.springframework.boot.autoconfigure.liquibase=INFO

# Enable Hibernate statistics for query counter profiling (PERF-05)
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=INFO

# Connection pool leak detection and metrics
spring.datasource.hikari.leak-detection-threshold=10000

# Batch fetch size to eliminate N+1 queries
spring.jpa.properties.hibernate.default_batch_fetch_size=50
